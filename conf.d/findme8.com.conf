
	
	server {
        listen       443 ssl; 
        server_name  findme8.com; #输入你的域名

        include conf.d/findme8.com.ssl;

        return 301 https://www.findme8.com$request_uri;
	}
	

	
	server {
        listen       443 ssl; 
        server_name  www.findme8.com; #输入你的域名

        include conf.d/findme8.com.ssl;

        location / {

			proxy_pass  http://mysql-in-db.findme8.com:81;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_cookie_path  / /;
        }
	}


	server {
        listen       443 ssl; 
        server_name  api.findme8.com; #输入你的域名

        include conf.d/findme8.com.ssl;

        location / {

	    proxy_pass  http://mysql-in-db.findme8.com:5000;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_cookie_path  / /;
			# 也可以在这里单独设置
            client_max_body_size 100M;
        }
}

	

	


        server {
        listen       443 ssl;
        server_name  admin.findme8.com; #输入你的域名

        include conf.d/findme8.com.ssl;

        location / {
            proxy_pass  http://mysql-in-db.findme8.com:5200;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "Upgrade";
        }
        }
	

	server {
	    listen       443 ssl; 
	    server_name static.findme8.com;
	    include conf.d/findme8.com.ssl;

	    location / {
	        # 指定本地目录路径
	        root /data/;
	        
	        # 默认首页文件（可选，如果只是放图片/静态文件，这行可以不加）
	        index index.html index.htm;
	        
	        # 如果你希望在浏览器中访问目录时，能像网盘一样列出文件列表，可以开启下一行（可选）
	        # autoindex on;
	    }
}
	

	
	
	
	
	
